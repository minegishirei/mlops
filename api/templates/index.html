<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iris Classifier | MLOps Lab</title>
    <style>
      :root { color-scheme: light; --ink: #193831; --muted: #63756e; --paper: #f4f7f0; --panel: #fffefa; --line: #d9e2d8; --green: #1c7657; --green-dark: #14513e; --coral: #df7959; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background-color: var(--paper); background-image: radial-gradient(#cedbcf 0.7px, transparent 0.7px); background-size: 17px 17px; color: var(--ink); font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
      main { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 64px; }
      .masthead { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .status { display: inline-flex; align-items: center; gap: 8px; }
      .status::before { width: 8px; height: 8px; border-radius: 50%; background: #55a47e; content: ""; }
      .intro { max-width: 710px; padding: 46px 0 32px; }
      .eyebrow { margin: 0 0 12px; color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 0; font-family: Georgia, "Yu Mincho", serif; font-size: clamp(38px, 6vw, 66px); font-weight: 500; line-height: 1.08; }
      .intro-copy { max-width: 580px; margin: 17px 0 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
      .workspace { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(280px, 0.7fr); border: 1px solid var(--line); background: var(--panel); }
      .form-panel, .result-panel { padding: 30px; }
      .result-panel { display: flex; flex-direction: column; justify-content: space-between; border-left: 1px solid var(--line); background: #edf4ed; }
      h2 { margin: 0; font-size: 17px; }
      .section-note { margin: 7px 0 24px; color: var(--muted); font-size: 13px; line-height: 1.6; }
      .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 17px 20px; }
      label { display: grid; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 700; }
      input { width: 100%; min-height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 3px; background: white; color: var(--ink); font: inherit; font-size: 16px; }
      input:focus { border-color: var(--green); outline: 3px solid #1c76571f; }
      .actions { display: flex; align-items: center; gap: 16px; margin-top: 25px; }
      button { min-height: 46px; padding: 0 20px; border: 0; border-radius: 3px; background: var(--green); color: white; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; }
      button:hover { background: var(--green-dark); }
      button:disabled { cursor: wait; opacity: 0.65; }
      .reset { padding: 8px 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; font: inherit; font-size: 13px; }
      .result-kicker { margin: 0 0 12px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
      .result-name { min-height: 82px; margin: 0; color: var(--green-dark); font-family: Georgia, "Yu Mincho", serif; font-size: 38px; line-height: 1.2; overflow-wrap: anywhere; }
      .result-detail { min-height: 42px; margin: 12px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; }
      .flower-mark { align-self: flex-end; margin-top: 25px; color: var(--coral); font-family: Georgia, serif; font-size: 48px; line-height: 1; }
      .error { color: #9b3d2e; }
      @media (max-width: 720px) { main { width: min(100% - 28px, 540px); padding-top: 28px; } .masthead { align-items: flex-start; font-size: 10px; } .intro { padding: 36px 0 25px; } .workspace { grid-template-columns: 1fr; } .form-panel, .result-panel { padding: 23px; } .result-panel { min-height: 210px; border-top: 1px solid var(--line); border-left: 0; } }
      @media (max-width: 420px) { .fields { grid-template-columns: 1fr; } .masthead { flex-direction: column; gap: 9px; } }
    </style>
  </head>
  <body>
    <main>
      <header class="masthead"><span>MLOps Lab / Model Playground</span><span class="status">推論サービス稼働中</span></header>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Iris · Random Forest</p>
        <h1 id="page-title">モデルに聞いてみる。</h1>
        <p class="intro-copy">花のサイズを入力して、学習済み分類モデルに予測させてみましょう。Prefectの学習フローで作成したモデルを使って推論します。</p>
      </section>
      <section class="workspace" aria-label="アヤメの分類予測">
        <form class="form-panel" id="predict-form">
          <h2>花のサイズ</h2>
          <p class="section-note">各項目をセンチメートルで入力してください。</p>
          <div class="fields">
            <label>がく片の長さ<input name="sepal_length" type="number" min="0" max="10" step="0.1" value="5.1" required></label>
            <label>がく片の幅<input name="sepal_width" type="number" min="0" max="10" step="0.1" value="3.5" required></label>
            <label>花びらの長さ<input name="petal_length" type="number" min="0" max="10" step="0.1" value="1.4" required></label>
            <label>花びらの幅<input name="petal_width" type="number" min="0" max="10" step="0.1" value="0.2" required></label>
          </div>
          <div class="actions"><button type="submit" id="predict-button">予測する</button><button class="reset" type="reset">初期値に戻す</button></div>
        </form>
        <section class="result-panel" aria-live="polite" aria-atomic="true">
          <div><p class="result-kicker">予測結果</p><p class="result-name" id="result-name">入力を待っています</p><p class="result-detail" id="result-detail">予測を実行すると、モデルの判定が表示されます。</p></div>
          <span class="flower-mark" aria-hidden="true">✳</span>
        </section>
      </section>
    </main>
    <script>
      const form = document.querySelector("#predict-form");
      const button = document.querySelector("#predict-button");
      const resultName = document.querySelector("#result-name");
      const resultDetail = document.querySelector("#result-detail");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        resultName.classList.remove("error");
        resultName.textContent = "予測中...";
        resultDetail.textContent = "Flask APIに測定値を送信しています。";
        const values = ["sepal_length", "sepal_width", "petal_length", "petal_width"].map((name) => Number(new FormData(form).get(name)));
        try {
          const response = await fetch("/api/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ features: [values] }) });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "予測に失敗しました。");
          resultName.textContent = data.class_names[0];
          resultDetail.textContent = [
            `クラス ${data.predictions[0]} · Random Forest`,
            `Model: ${data.model_tag || "unknown"}`,
            `MLflow run: ${data.mlflow_run_id || "unknown"}`,
            `Trace ID: ${response.headers.get("X-Trace-ID") || "unknown"}`,
          ].join("\n");
        } catch (error) {
          resultName.classList.add("error");
          resultName.textContent = "利用できません";
          resultDetail.textContent = error.message;
        } finally { button.disabled = false; }
      });
    </script>
  </body>
</html>
