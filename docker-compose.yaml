services:
  mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./data/mlflow:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 10

  prefect:
    build: ./prefect
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - ./data/prefect:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 15

  aspire-dashboard:
    image: mcr.microsoft.com/aspire/dashboard:latest
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
    expose:
      - "18889"
      - "18890"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317"
      - "4318"
    depends_on:
      - aspire-dashboard

  train:
    build: ./train
    image: mlops-trainer:isolated
    profiles: ["training"]
    command: ["python", "training.py"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREFECT_API_URL: http://prefect:4200/api
      BENTOML_HOME: /bentoml
      OTEL_SERVICE_NAME: mlops-training
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    volumes:
      - ./data/bentoml:/bentoml
    depends_on:
      mlflow:
        condition: service_healthy
      prefect:
        condition: service_healthy

  worker:
    build: ./train
    image: mlops-trainer:isolated
    command:
      - sh
      - -c
      - |
        set -e
        prefect work-pool inspect iris-process >/dev/null 2>&1 || prefect work-pool create --type process iris-process
        prefect deploy training.py:training_pipeline --name iris-training --pool iris-process --no-prompt
        prefect worker start --pool iris-process
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREFECT_API_URL: http://prefect:4200/api
      BENTOML_HOME: /bentoml
      OTEL_SERVICE_NAME: mlops-training
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    volumes:
      - ./data/bentoml:/bentoml
    depends_on:
      mlflow:
        condition: service_healthy
      prefect:
        condition: service_healthy

  bentoml:
    build: ./bentoml
    image: mlops-bentoml:isolated
    environment:
      BENTOML_HOME: /bentoml
      BENTOML_MODEL_TAG: ${BENTOML_MODEL_TAG:-iris_classifier:latest}
      OTEL_SERVICE_NAME: mlops-bentoml
    ports:
      - "3000:3000"
    volumes:
      - ./data/bentoml:/bentoml

  api:
    build: ./api
    environment:
      BENTOML_API_URL: http://bentoml:3000
      BENTOML_MODEL_TAG: ${BENTOML_MODEL_TAG:-iris_classifier:latest}
      OTEL_SERVICE_NAME: mlops-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8000:8000"
    depends_on:
      - bentoml